name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest с ноября 2026 — Ubuntu 26.04, а setup-python не ставит на
    # неё Python 3.9. Инструмент обещает 3.9+, поэтому раннер закреплён.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
