[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nativeprompt"
version = "0.9.0"
description = "Rewrite your prompt into the native dialect of the model you're actually using (Claude Opus 5.5, Fable 5.1, GPT-6 Astra/Sol/Luna, Codex) by each vendor's OFFICIAL rules, tell you why, and recommend the effort level to run it at."
readme = "README.en.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Edvard Grishin" }]
keywords = ["prompt", "prompt-engineering", "llm", "claude", "openai", "codex", "prompt-optimizer"]
dependencies = []  # zero runtime deps on purpose: stdlib only, offline, deterministic

[project.urls]
Homepage = "https://github.com/edvardgrishin27/nativeprompt"
Source = "https://github.com/edvardgrishin27/nativeprompt"

[project.scripts]
nativeprompt = "nativeprompt.__main__:main"

[tool.setuptools]
packages = ["nativeprompt"]

[tool.setuptools.package-data]
# SKILL.md обязан ехать В ПАКЕТЕ, а не только в репозитории: после
# `pipx install` у человека нет клона, и ставить навык было неоткуда.
nativeprompt = ["rules/*.json", "assets/skill/SKILL.md"]
